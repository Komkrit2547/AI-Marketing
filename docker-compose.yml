services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/ai_marketing
      - PORT=4000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - app-network

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/database/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - app-network

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_HOST=http://localhost:5678
      - DB_TYPE=mongodb
      - DB_MONGODB_CONNECTION_URL=mongodb://mongodb:27017/n8n
    volumes:
      - n8n_data:/home/node/.n8n
      - ./backend/n8n/workflows:/home/node/.n8n/workflows
    depends_on:
      - mongodb
    networks:
      - app-network

  prisma-studio:
    build: ./backend
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/ai_marketing
    command: npx prisma studio --hostname 0.0.0.0 --port 5555 --browser none
    depends_on:
      - mongodb
    networks:
      - app-network

volumes:
  mongodb_data:
  n8n_data:

networks:
  app-network:
    driver: bridge
