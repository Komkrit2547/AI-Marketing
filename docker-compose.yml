services:
  frontend:
    build: 
      context: ./frontend
      target: builder
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/ai_marketing
      - PORT=4000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - app-network

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/database/init.js:/docker-entrypoint-initdb.d/init.js
      - ./backend/database/fix-ai-insight-dates.js:/scripts/fix-ai-insight-dates.js
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" | mongosh --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      retries: 30
    networks:
      - app-network

  db-migration:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["mongosh", "mongodb://mongodb:27017/ai_marketing", "/scripts/fix-ai-insight-dates.js"]
    volumes:
      - ./backend/database/fix-ai-insight-dates.js:/scripts/fix-ai-insight-dates.js
    networks:
      - app-network
    restart: "no"

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_HOST=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    entrypoint: ["tini", "--", "/bin/sh", "-c"]
    command: ["n8n import:workflow --separate --input=/home/node/.n8n/workflows || true && n8n update:workflow --all --active=true || true && n8n"]
    depends_on:
      - mongodb
    networks:
      - app-network

  prisma-studio:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/ai_marketing
    command: npx prisma studio --hostname 0.0.0.0 --port 5555 --browser none
    depends_on:
      - mongodb
    networks:
      - app-network

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/ai_marketing
    volumes:
      - ./scraper/facebook-session.json:/app/facebook-session.json
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongodb_data:
  n8n_data:

networks:
  app-network:
    driver: bridge
